<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #030712;
    color: #00eaff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 420px;
}

h1 {
    letter-spacing: 10px;
    font-size: 38px;
    text-shadow: 0 0 20px #00eaff;
}

p {
    color: #91a8c4;
    margin: 15px 0 35px;
}

.orb {
    width: 190px;
    height: 190px;
    border: 3px solid #00eaff;
    border-radius: 50%;
    margin: 30px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    box-shadow: 0 0 25px #00eaff,
                inset 0 0 25px #00eaff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 45px #00eaff,
                    inset 0 0 40px #00eaff;
    }
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 14px 0;
    border: 1px solid #00eaff;
    background: transparent;
    color: #00eaff;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    background: #003b4a;
}

#status {
    margin-top: 25px;
    color: #fff;
    font-size: 14px;
}
</style>
</head>

<body>
<div class="container">

    <h1>J.A.R.V.I.S.</h1>
    <p>PERSONAL AI ASSISTANT</p>

    <div class="orb">◈</div>

    <button onclick="greet()">🔊 GOOD EVENING</button>

    <button onclick="listen()">🎙️ TALK TO JARVIS</button>

    <button onclick="openYouTube()">▶ OPEN YOUTUBE</button>

    <div id="status">SYSTEM ONLINE</div>

</div>

<script>
function speak(text) {
    if (!("speechSynthesis" in window)) {
        document.getElementById("status").innerText =
            "Speech is not supported in this browser.";
        return;
    }

    speechSynthesis.cancel();

    const message = new SpeechSynthesisUtterance(text);
    message.lang = "en-IN";
    message.rate = 0.95;

    speechSynthesis.speak(message);

    document.getElementById("status").innerText = text;
}

function greet() {
    const hour = new Date().getHours();
    let greeting;

    if (hour < 12) {
        greeting = "Good morning";
    } else if (hour < 17) {
        greeting = "Good afternoon";
    } else {
        greeting = "Good evening";
    }

    speak(greeting + ", boss. JARVIS is online. How may I assist you?");
}

function listen() {
    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        document.getElementById("status").innerText =
            "Voice recognition is not supported here.";
        return;
    }

    const recognition = new Recognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;

    document.getElementById("status").innerText =
        "Listening...";

    recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;

        document.getElementById("status").innerText =
            "You said: " + text;

        speak("I heard you say " + text +
              ". My AI brain will be connected in a later step.");
    };

    recognition.onerror = function() {
        document.getElementById("status").innerText =
            "Could not hear you. Check microphone permission.";
    };

    recognition.start();
}

function openYouTube() {
    window.open("https://www.youtube.com/", "_blank");
}
</script>

</body>
</html>
